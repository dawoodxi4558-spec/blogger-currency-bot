name: Update Secure Currency Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot Script
        run: node bot.js

      - name: Upload Secure Currency Data
        uses: actions/upload-artifact@v4
        with:
          name: live-data
          path: data.json
          
